name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "apps-script/**"
      - ".clasp.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-apps-script.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apps-script
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install clasp
        run: npm ci

      - name: Configure Google authentication
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          test -n "$CLASPRC_JSON" || { echo "CLASPRC_JSON secret is missing"; exit 1; }
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"

      - name: Push source to Apps Script
        run: npm run apps-script:push
